<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PDF OCR GUI</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 0;
        background: #f4f5f7;
        color: #1f2937;
      }

      .container {
        max-width: 720px;
        margin: 24px auto;
        background: #ffffff;
        border: 1px solid #e5e7eb;
        border-radius: 10px;
        padding: 20px;
      }

      h1 {
        margin-top: 0;
        font-size: 1.5rem;
      }

      .field {
        margin-bottom: 14px;
      }

      .hint {
        margin-top: 4px;
        color: #6b7280;
        font-size: 0.85rem;
      }

      label {
        display: block;
        margin-bottom: 6px;
        font-weight: 600;
      }

      label span[title] {
        font-size: 0.85rem;
        cursor: help;
        color: #6b7280;
      }

      .row {
        display: flex;
        gap: 8px;
      }

      input[type='text'],
      input[type='number'] {
        width: 100%;
        padding: 10px;
        border: 1px solid #cbd5e1;
        border-radius: 6px;
        font-size: 0.95rem;
      }

      button {
        border: none;
        border-radius: 6px;
        padding: 10px 14px;
        cursor: pointer;
      }

      .btn-primary {
        background: #2563eb;
        color: #fff;
      }

      .btn-secondary {
        background: #e5e7eb;
        color: #111827;
      }

      .status {
        margin-top: 12px;
        font-weight: 600;
      }

      progress {
        width: 100%;
        margin-top: 8px;
        height: 16px;
      }

      .logs {
        margin-top: 14px;
        border: 1px solid #d1d5db;
        border-radius: 6px;
        background: #111827;
        color: #e5e7eb;
        min-height: 180px;
        max-height: 220px;
        overflow: auto;
        padding: 10px;
        font-family: monospace;
        font-size: 0.9rem;
        white-space: pre-wrap;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>PDF OCR GUI</h1>

      <div class="field">
        <label for="inputPath">Input PDF</label>
        <div class="row">
          <input id="inputPath" type="text" readonly placeholder="Select a PDF file" />
          <button id="browseBtn" class="btn-secondary" type="button">Browse...</button>
        </div>
      </div>

      <div class="field">
        <label for="outputPrefix">Output Prefix</label>
        <input id="outputPrefix" type="text" placeholder="Defaults to input file name" />
      </div>

      <div class="field">
        <label for="workers">Workers</label>
        <input id="workers" type="number" min="1" value="4" />
        <div class="hint">Parallel OCR workers. More workers can be faster, but use more CPU/RAM.</div>
      </div>

      <div class="field">
        <label>
          <input id="keepTemp" type="checkbox" />
          Keep temporary files
        </label>
      </div>

      <button id="runBtn" class="btn-primary" type="button">Run OCR</button>

      <div id="status" class="status">Idle</div>
      <progress id="progressBar" value="0" max="100"></progress>

      <div id="logs" class="logs"></div>
    </div>

    <script src="renderer.js"></script>
  </body>
</html>
